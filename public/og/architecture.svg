    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Tag -->
  <rect x="80" y="80" width="32" height="1" fill="#00f0ff" opacity="0.5"/>
  <text x="128" y="87" font-family="'Courier New', monospace" font-size="11" fill="#00f0ff" opacity="0.7" letter-spacing="3">ARCHITECTURE REFERENCE · REV. 13</text>


  <text x="80" y="430" font-family="'Courier New', monospace" font-size="12" fill="rgba(0,240,255,0.6)" letter-spacing="1">CinematicOrchestrator → ScrollEngine → PointerEngine → BootSystem → cinematic-entry</text>

  <!-- Key specs -->

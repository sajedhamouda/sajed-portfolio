      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#050508"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Tech grid -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#080808"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle vertical lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1" fill="none">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>

  <!-- Violet accent -->
  <ellipse cx="1000" cy="200" rx="280" ry="180" fill="rgba(167,139,250,0.06)"/>

  <!-- Section tag -->
  <rect x="80" y="80" width="32" height="1" fill="#00f0ff" opacity="0.5"/>
  <text x="128" y="87" font-family="'Courier New', monospace" font-size="11" fill="#00f0ff" opacity="0.7" letter-spacing="3">ENGINEERING CASE STUDY · DA VINCI STUDIO</text>

  <!-- Main headline -->
  <text x="80" y="260" font-family="Impact, 'Arial Black', sans-serif" font-size="100" fill="#f0f0f0" letter-spacing="2" font-weight="900">CINEMATIC</text>
  <text x="80" y="370" font-family="Impact, 'Arial Black', sans-serif" font-size="100" fill="none" stroke="#a78bfa" stroke-width="1" letter-spacing="2" opacity="0.7">PORTFOLIO SYSTEM</text>

  <!-- Stats row -->
  <g fill="none">
    <rect x="80" y="420" width="1" height="60" fill="rgba(0,240,255,0.3)"/>
    <text x="96" y="445" font-family="'Courier New', monospace" font-size="22" fill="#00f0ff" letter-spacing="1">−82%</text>
    <text x="96" y="467" font-family="'Courier New', monospace" font-size="11" fill="rgba(240,240,240,0.4)" letter-spacing="2">ENTRY BUNDLE</text>

    <rect x="280" y="420" width="1" height="60" fill="rgba(255,255,255,0.08)"/>
    <text x="296" y="445" font-family="'Courier New', monospace" font-size="22" fill="rgba(240,240,240,0.7)" letter-spacing="1">13</text>
    <text x="296" y="467" font-family="'Courier New', monospace" font-size="11" fill="rgba(240,240,240,0.4)" letter-spacing="2">PHASES</text>

    <rect x="430" y="420" width="1" height="60" fill="rgba(255,255,255,0.08)"/>
    <text x="446" y="445" font-family="'Courier New', monospace" font-size="22" fill="rgba(240,240,240,0.7)" letter-spacing="1">0</text>
    <text x="446" y="467" font-family="'Courier New', monospace" font-size="11" fill="rgba(240,240,240,0.4)" letter-spacing="2">ANIMATION LIBS</text>

    <rect x="620" y="420" width="1" height="60" fill="rgba(255,255,255,0.08)"/>
    <text x="636" y="445" font-family="'Courier New', monospace" font-size="22" fill="rgba(240,240,240,0.7)" letter-spacing="1">10.7 kB</text>
    <text x="636" y="467" font-family="'Courier New', monospace" font-size="11" fill="rgba(240,240,240,0.4)" letter-spacing="2">ENTRY BUNDLE</text>
  </g>

  <!-- Bottom line -->
  <rect x="80" y="560" width="1040" height="1" fill="rgba(255,255,255,0.06)"/>
  <text x="80" y="582" font-family="'Courier New', monospace" font-size="11" fill="rgba(240,240,240,0.3)" letter-spacing="2">davincistudio.ae/case-study</text>
  <text x="1120" y="582" font-family="'Courier New', monospace" font-size="11" fill="#a78bfa" opacity="0.5" letter-spacing="2" text-anchor="end">ASTRO · REACT · THREE.JS</text>
